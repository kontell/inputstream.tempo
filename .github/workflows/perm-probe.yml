# Throwaway diagnostic: can GITHUB_TOKEN create a release from this ref?
name: Perm probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Try to create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "ref=$GITHUB_REF  sha=$GITHUB_SHA"
          tag="perm-probe-${GITHUB_RUN_ID}"
          code=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$tag" -f name="$tag" -F draft=true \
            -f target_commitish="$GITHUB_SHA" \
            --silent -i 2>&1 | head -1 || true)
          echo "RESULT: $code"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$tag" -f name="$tag" -F draft=true \
            -f target_commitish="$GITHUB_SHA" --jq .id > /tmp/id 2>/tmp/err || true
          if [ -s /tmp/id ]; then
            echo "CREATED id=$(cat /tmp/id) — cleaning up"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$(cat /tmp/id)"
          else
            echo "FAILED:"; cat /tmp/err
          fi
