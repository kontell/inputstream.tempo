name: Build
on:
  push:
    branches: ['**']
  pull_request:
env:
  app_id: inputstream.tempo

jobs:
  build:
    runs-on: ubuntu-latest
    name: Linux x86_64 / Kodi 21
    steps:
    - name: Checkout addon
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}

    - name: Checkout Kodi
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: Omega
        path: xbmc
        sparse-checkout: |
          version.txt
          xbmc/interfaces/json-rpc/schema/version.txt
          cmake/
          xbmc/addons/AddonBindings.cmake
          xbmc/addons/kodi-dev-kit/include/kodi/
        sparse-checkout-cone-mode: false
        fetch-depth: 1

    - name: Install dependencies
      run: sudo apt-get update -qq && sudo apt-get install -y autopoint nasm

    - name: Register addon
      run: |
        mkdir -p xbmc/cmake/addons/addons/${app_id}
        echo "${app_id} ${{ github.workspace }}/${app_id}" > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt

    - name: Configure
      run: |
        cmake \
          -B ${app_id}/build \
          -DADDONS_TO_BUILD=${app_id} \
          -DADDON_SRC_PREFIX=${{ github.workspace }} \
          -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/output \
          -DPACKAGE_ZIP=1 \
          ${{ github.workspace }}/xbmc/cmake/addons

    - name: Build
      run: make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)

    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.app_id }}-linux-x86_64-kodi21
        path: |
          ${{ env.app_id }}/build/${{ env.app_id }}/**/*.zip
          ${{ env.app_id }}/build/zips/**/*.zip
        if-no-files-found: warn
