# Tag release: build every platform for both Kodi versions, then draft a GitHub
# release with the zips attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip release creation — run the build matrix only"
        type: boolean
        default: false

# Least privilege: the build matrix only reads and uploads. Only the release job
# needs write. (Was contents: write at workflow level, so every build job in the
# matrix carried write access it never used.)
permissions:
  contents: read

env:
  app_id: inputstream.tempo
  kodi_omega_ref: "21.3-Omega"
  kodi_piers_ref: "22.0b1-Piers"
  max_glibc: "2.38"

jobs:
  build-linux:
    name: package (${{ matrix.os }} ${{ matrix.arch }}, ${{ matrix.channel }})
    # NOT built in a pinned container, unlike pvr.kofin, and that is a staging
    # decision rather than an oversight. This addon builds FFmpeg plus gnutls,
    # nettle, gmp, iconv and libzvbi from source through autotools, with
    # cross-compile quirks documented in CLAUDE.md — a much larger dependency
    # surface to move into a bare image, and one that cannot be verified without
    # running it. pvr.kofin's container (four build tools) goes first; this
    # follows once that has proven itself over a release or two.
    #
    # Meanwhile the runner label is pinned, which is what stops the floor moving
    # when GitHub remaps ubuntu-latest. The ABI assertion below is what will say
    # whether the floor is actually acceptable on this image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, channel: Piers, kodi: 22 }
          - { os: linux, arch: armv7, channel: Piers, kodi: 22, cross_pkgs: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf" }
          - { os: linux, arch: aarch64, channel: Piers, kodi: 22, cross_pkgs: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu" }
          - { os: android, arch: armv7, channel: Piers, kodi: 22 }
          - { os: android, arch: aarch64, channel: Piers, kodi: 22 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ matrix.channel == 'Omega' && env.kodi_omega_ref || env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autopoint nasm ${{ matrix.cross_pkgs }}

      - name: Setup Android NDK
        if: matrix.os == 'android'
        id: setup-ndk
        run: |
          NDK_VERSION=r25c
          NDK_DIR="$HOME/android-ndk-${NDK_VERSION}"
          if [ ! -d "$NDK_DIR" ]; then
            wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            rm /tmp/ndk.zip
          fi
          echo "ndk-path=$NDK_DIR" >> $GITHUB_OUTPUT

      - name: Build
        env:
          # Static C++ runtime on Linux so the .so depends only on glibc, not on a
          # GLIBCXX_3.4.x the target lacks. The superbuild forwards CMAKE_C/CXX_FLAGS
          # but not linker flags, hence LDFLAGS. Empty on Android (NDK's own STL).
          LDFLAGS: ${{ matrix.os == 'linux' && '-static-libstdc++ -static-libgcc' || '' }}
        run: |
          ${{ github.workspace }}/${app_id}/scripts/build.sh \
            --os ${{ matrix.os }} \
            --arch ${{ matrix.arch }} \
            --kodi ${{ matrix.kodi }} \
            --kodi-src ${{ github.workspace }}/xbmc \
            ${{ matrix.os == 'android' && format('--ndk {0}', steps.setup-ndk.outputs.ndk-path) || '' }} \
            --output ${{ github.workspace }}/artifacts \
            --jobs $(getconf _NPROCESSORS_ONLN)

      - name: Assert the ABI floor
        run: |
          ${{ github.workspace }}/${app_id}/scripts/check-abi.sh \
            ${{ github.workspace }}/artifacts "${{ env.max_glibc }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-${{ matrix.os }}-${{ matrix.arch }}-kodi${{ matrix.kodi }}
          path: ${{ github.workspace }}/artifacts/*.zip
          # Not the default (warn). This addon is the reason the default matters:
          # v0.3.11 attached 10 assets from 12 green jobs because the Windows jobs
          # uploaded nothing and warn is not a failure.
          if-no-files-found: error

  build-windows:
    name: package (windows x86_64, ${{ matrix.channel }})
    runs-on: windows-2022
    # Tolerated because it is already broken, and tolerating it visibly is better
    # than either of the alternatives: without this the whole release fails and no
    # platform ships, and without if-no-files-found: error below it goes green and
    # nobody learns. The job will show as failed; the release still drafts with the
    # platforms that do build. Once Windows attaches a zip: drop this line, move
    # windows-x86_64 from known_missing to required in the release job, and add it
    # to inputstream.tempo's platforms in repository.kontell/addons.toml.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: Piers, kodi: 22 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ matrix.channel == 'Omega' && env.kodi_omega_ref || env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          WS="$(pwd -W)"
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${WS}/${app_id}" > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt

          cmake \
            -B "${app_id}/build" \
            -G "Visual Studio 17 2022" -A x64 -T host=x64 \
            -DADDONS_TO_BUILD="${app_id}" \
            -DADDON_SRC_PREFIX="${WS}" \
            -DADDONS_DEFINITION_DIR="${WS}/xbmc/cmake/addons/addons" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${WS}/install" \
            -DPACKAGE_ZIP=1 \
            "${WS}/xbmc/cmake/addons"
          cmake --build "${app_id}/build" --config Release --target "${app_id}"

          VERSION=$(grep '^ *version=' "${app_id}/${app_id}/addon.xml.in" | head -1 | sed 's/.*version="\([^"]*\)".*/\1/')
          ZIP_NAME="${app_id}-${VERSION}-windows-x86_64-kodi${{ matrix.kodi }}.zip"
          mkdir -p artifacts
          # This is the diagnostic that was missing. The build reports success but
          # no zip ever reached a release, so say plainly what the install step
          # produced instead of letting 7z make an empty archive.
          if [[ ! -d "install/${app_id}" ]]; then
            echo "::error::install/${app_id} does not exist after a successful build," \
                 "so there is nothing to package. This is the known Windows gap:" \
                 "v0.3.11 shipped 10 assets from 12 green jobs." >&2
            echo "--- install/ ---"; ls -la install 2>/dev/null || echo "(no install/)"
            echo "--- zips anywhere ---"; find . -name '*.zip' -not -path './xbmc/*' | head
            exit 1
          fi
          (cd install && 7z a -tzip "${WS}/artifacts/${ZIP_NAME}" "${app_id}/")
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-windows-x86_64-kodi${{ matrix.kodi }}
          path: ${{ github.workspace }}/artifacts/*.zip
          if-no-files-found: error

  release:
    name: release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5

      - name: Assert tag matches addon.xml.in version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^ *version=' ${app_id}/addon.xml.in | head -1 | sed 's/.*version="\([^"]*\)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          echo "addon.xml.in version=$version  tag=$tag"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::tag v$tag does not match addon.xml.in version $version." \
                 "Every name in the release is derived from the tagged tree, so they" \
                 "would all disagree with the tag. Retag on a commit with the bump." >&2
            exit 1
          fi

      - name: Assert the tag belongs to this channel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          # This branch builds Piers only, so a v22.* tag is the only kind that
          # can legitimately be cut here. Without this, a tag pushed on the wrong
          # branch produces a complete, plausible release of the wrong Kodi version
          # — and because the channel is derived from the version major, it would be
          # filed into the wrong directory in the repository too.
          tag="${GITHUB_REF_NAME#v}"
          major="${tag%%.*}"
          echo "tag=$GITHUB_REF_NAME major=$major expected=22 (Piers)"
          if [[ "$major" != "22" ]]; then
            echo "::error::$GITHUB_REF_NAME is not a Piers tag (expected v22.y.z)." \
                 "Cut Piers releases on this branch and the other channel's on its own." >&2
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten and inventory artifacts
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -mindepth 2 -name '*.zip' -exec mv {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete
          ls -la artifacts/

          # Every platform that must be present, per Kodi version. Windows is
          # listed separately because it is a known gap being tracked, not because
          # it is optional: its absence warns loudly rather than passing silently,
          # and anything else missing fails the release.
          required=(linux-x86_64 linux-armv7 linux-aarch64 android-armv7 android-aarch64)
          known_missing=(windows-x86_64)
          status=0
          for kodi in 21 22; do
            for plat in "${required[@]}"; do
              if ! ls artifacts/${app_id}-*-${plat}-kodi${kodi}.zip >/dev/null 2>&1; then
                echo "::error::missing ${plat} for Kodi ${kodi}" >&2
                status=1
              fi
            done
            for plat in "${known_missing[@]}"; do
              if ! ls artifacts/${app_id}-*-${plat}-kodi${kodi}.zip >/dev/null 2>&1; then
                echo "::warning::${plat} for Kodi ${kodi} is absent — the tracked" \
                     "Windows gap. This release will not serve Windows users." >&2
              else
                echo "::notice::${plat} for Kodi ${kodi} is present — the Windows gap" \
                     "is fixed. Move it out of known_missing here, drop" \
                     "continue-on-error from build-windows, and add windows-x86_64 to" \
                     "inputstream.tempo's platforms in repository.kontell/addons.toml." >&2
              fi
            done
          done
          echo "zips: $(find artifacts -name '*.zip' | wc -l)"
          exit $status

      - name: Get version and changelog
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^ *version=' ${app_id}/addon.xml.in | head -1 | sed 's/.*version="\([^"]*\)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
          changes="$(awk -v RS= 'NR==1' ${app_id}/changelog.txt)"
          EOF="$(dd if=/dev/urandom bs=15 count=1 status=none | base64)"
          {
            echo "changes<<$EOF"
            echo "$changes"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.app_id }} ${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.changes }}
          draft: true
          files: artifacts/*.zip
