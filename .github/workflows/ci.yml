# Every-PR gate: does it compile for both Kodi versions, and does it package.
# release.yml handles tags and is the only place a release is built.
#
# Renamed from build.yml, and its trigger narrowed. It ran on
# `push: branches: ['**']` *and* `pull_request`, so every push to a feature branch
# with an open PR was billed twice.
name: CI

on:
  push:
    branches: [Omega]
    # Documentation cannot break a build. Applied to pushes only: on a pull
    # request an all-ignored change reports no checks at all, which is a trap if
    # required checks are ever turned on.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:

# Supersede a PR's in-flight run when it is pushed to again. With the full
# platform matrix a single PR is a dozen jobs, and on inputstream.tempo each is
# ten minutes of FFmpeg — paying twice for a superseded commit is pure waste.
# Never applied to branch pushes: those are what release tags are cut from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  app_id: inputstream.tempo
  # Pinned Kodi sources. addon.xml.in's @ADDON_DEPENDS@ is filled from these
  # headers, so an unpinned ref lets the declared kodi.binary.instance.inputstream
  # version move with no commit here — and the zip then stops installing on a Kodi
  # the user already has. drift.yml watches upstream tip separately.
  kodi_omega_ref: "21.3-Omega"
  kodi_piers_ref: "22.0b1-Piers"

jobs:
  compile:
    name: compile (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # gcc on every push; clang as well on a pull request. This has to be an
        # expression here rather than an `if` on the job, because a job-level `if`
        # cannot read the matrix context.
        include: ${{ github.event_name == 'pull_request'
          && fromJSON('[{"cc":"gcc","cxx":"g++"},{"cc":"clang","cxx":"clang++"}]')
          || fromJSON('[{"cc":"gcc","cxx":"g++"}]') }}
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_omega_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        # nasm is for the bundled FFmpeg build, which is what makes this addon's
        # dependency chain heavier than a plain binary addon's.
        run: sudo apt-get update -qq && sudo apt-get install -y autopoint nasm

      - name: Register addon
        shell: bash
        run: |
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${{ github.workspace }}/${app_id}" \
            > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake \
            -B ${app_id}/build \
            -DADDONS_TO_BUILD=${app_id} \
            -DADDON_SRC_PREFIX=${{ github.workspace }} \
            -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/output \
            -DPACKAGE_ZIP=1 \
            ${{ github.workspace }}/xbmc/cmake/addons

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)

  compile-windows:
    # Pull requests only. A push to this branch is normally the merge of a PR
    # whose checks already ran against the merge ref, and release.yml rebuilds
    # every platform on the tag — so the merge-time repeat is redundant.
    if: github.event_name == 'pull_request'
    name: compile (msvc, ${{ matrix.channel }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: Omega, kodi: 21 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_omega_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          WS="$(pwd -W)"
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${WS}/${app_id}" > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
          cmake \
            -B "${app_id}/build" \
            -G "Visual Studio 17 2022" -A x64 -T host=x64 \
            -DADDONS_TO_BUILD="${app_id}" \
            -DADDON_SRC_PREFIX="${WS}" \
            -DADDONS_DEFINITION_DIR="${WS}/xbmc/cmake/addons/addons" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${WS}/output" \
            -DPACKAGE_ZIP=1 \
            "${WS}/xbmc/cmake/addons"
          cmake --build "${app_id}/build" --config Release --target "${app_id}"

      - name: Did the install tree appear?
        shell: bash
        run: |
          set -uo pipefail
          # The open question behind the missing Windows release assets: the build
          # reports success, but no zip reaches the release. This says plainly
          # whether an installable tree exists after a green build, which is the
          # first thing to know. Informational here; release.yml treats a missing
          # Windows zip as a tracked failure rather than a silent absence.
          echo "--- output/ ---"; ls -la output 2>/dev/null || echo "(no output/)"
          echo "--- output/${app_id} ---"; ls -la "output/${app_id}" 2>/dev/null || echo "(absent)"
          echo "--- any zip anywhere ---"; find . -name '*.zip' -not -path './xbmc/*' 2>/dev/null | head

  # Every artifact a release produces, built the same way. Previously this was
  # one linux-x86_64 zip, which left armv7, aarch64 and Android — the NDK path
  # especially — entirely unbuilt until release time. The cross-builds are
  # 45-110s each on pvr.kofin, so the coverage is close to free there.
  #
  # The matrices below are copied from release.yml and checked against it, so a
  # platform added to one cannot silently be missing from the other.
  package-linux:
    # Pull requests only. A push to this branch is normally the merge of a PR
    # whose checks already ran against the merge ref, and release.yml rebuilds
    # every platform on the tag — so the merge-time repeat is redundant.
    if: github.event_name == 'pull_request'
    name: package (${{ matrix.os }} ${{ matrix.arch }}, ${{ matrix.channel }})
    # NOT built in a pinned container, unlike pvr.kofin, and that is a staging
    # decision rather than an oversight. This addon builds FFmpeg plus gnutls,
    # nettle, gmp, iconv and libzvbi from source through autotools, with
    # cross-compile quirks documented in CLAUDE.md — a much larger dependency
    # surface to move into a bare image, and one that cannot be verified without
    # running it. pvr.kofin's container (four build tools) goes first; this
    # follows once that has proven itself over a release or two.
    #
    # Meanwhile the runner label is pinned, which is what stops the floor moving
    # when GitHub remaps ubuntu-latest. The ABI assertion below is what will say
    # whether the floor is actually acceptable on this image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, channel: Omega, kodi: 21 }
          - { os: linux, arch: armv7, channel: Omega, kodi: 21, cross_pkgs: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf" }
          - { os: linux, arch: aarch64, channel: Omega, kodi: 21, cross_pkgs: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu" }
          - { os: android, arch: armv7, channel: Omega, kodi: 21 }
          - { os: android, arch: aarch64, channel: Omega, kodi: 21 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_omega_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autopoint nasm ${{ matrix.cross_pkgs }}

      - name: Setup Android NDK
        if: matrix.os == 'android'
        id: setup-ndk
        run: |
          NDK_VERSION=r25c
          NDK_DIR="$HOME/android-ndk-${NDK_VERSION}"
          if [ ! -d "$NDK_DIR" ]; then
            wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            rm /tmp/ndk.zip
          fi
          echo "ndk-path=$NDK_DIR" >> $GITHUB_OUTPUT

      - name: Build
        env:
          # Static C++ runtime on Linux so the .so depends only on glibc, not on a
          # GLIBCXX_3.4.x the target lacks. The superbuild forwards CMAKE_C/CXX_FLAGS
          # but not linker flags, hence LDFLAGS. Empty on Android (NDK's own STL).
          LDFLAGS: ${{ matrix.os == 'linux' && '-static-libstdc++ -static-libgcc' || '' }}
        run: |
          ${{ github.workspace }}/${app_id}/scripts/build.sh \
            --os ${{ matrix.os }} \
            --arch ${{ matrix.arch }} \
            --kodi ${{ matrix.kodi }} \
            --kodi-src ${{ github.workspace }}/xbmc \
            ${{ matrix.os == 'android' && format('--ndk {0}', steps.setup-ndk.outputs.ndk-path) || '' }} \
            --output ${{ github.workspace }}/artifacts \
            --jobs $(getconf _NPROCESSORS_ONLN)

      - name: Assert the ABI floor
        run: |
          ${{ github.workspace }}/${app_id}/scripts/check-abi.sh \
            ${{ github.workspace }}/artifacts "${{ env.max_glibc }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-${{ matrix.os }}-${{ matrix.arch }}-pr
          retention-days: 14
          path: ${{ github.workspace }}/artifacts/*.zip
          # Not the default (warn). This addon is the reason the default matters:
          # v0.3.11 attached 10 assets from 12 green jobs because the Windows jobs
          # uploaded nothing and warn is not a failure.
          if-no-files-found: error

  package-windows:
    # Pull requests only. A push to this branch is normally the merge of a PR
    # whose checks already ran against the merge ref, and release.yml rebuilds
    # every platform on the tag — so the merge-time repeat is redundant.
    if: github.event_name == 'pull_request'
    name: package (windows x86_64, ${{ matrix.channel }})
    runs-on: windows-2022
    # Tolerated because it is already broken, and tolerating it visibly is better
    # than either of the alternatives: without this the whole release fails and no
    # platform ships, and without if-no-files-found: error below it goes green and
    # nobody learns. The job will show as failed; the release still drafts with the
    # platforms that do build. Once Windows attaches a zip: drop this line, move
    # windows-x86_64 from known_missing to required in the release job, and add it
    # to inputstream.tempo's platforms in repository.kontell/addons.toml.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: Omega, kodi: 21 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_omega_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          WS="$(pwd -W)"
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${WS}/${app_id}" > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt

          cmake \
            -B "${app_id}/build" \
            -G "Visual Studio 17 2022" -A x64 -T host=x64 \
            -DADDONS_TO_BUILD="${app_id}" \
            -DADDON_SRC_PREFIX="${WS}" \
            -DADDONS_DEFINITION_DIR="${WS}/xbmc/cmake/addons/addons" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${WS}/install" \
            -DPACKAGE_ZIP=1 \
            "${WS}/xbmc/cmake/addons"
          cmake --build "${app_id}/build" --config Release --target "${app_id}"

          VERSION=$(grep '^ *version=' "${app_id}/${app_id}/addon.xml.in" | head -1 | sed 's/.*version="\([^"]*\)".*/\1/')
          ZIP_NAME="${app_id}-${VERSION}-windows-x86_64.zip"
          mkdir -p artifacts
          # This is the diagnostic that was missing. The build reports success but
          # no zip ever reached a release, so say plainly what the install step
          # produced instead of letting 7z make an empty archive.
          if [[ ! -d "install/${app_id}" ]]; then
            echo "::error::install/${app_id} does not exist after a successful build," \
                 "so there is nothing to package. This is the known Windows gap:" \
                 "v0.3.11 shipped 10 assets from 12 green jobs." >&2
            echo "--- install/ ---"; ls -la install 2>/dev/null || echo "(no install/)"
            echo "--- zips anywhere ---"; find . -name '*.zip' -not -path './xbmc/*' | head
            exit 1
          fi
          (cd install && 7z a -tzip "${WS}/artifacts/${ZIP_NAME}" "${app_id}/")
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-windows-x86_64-pr
          retention-days: 14
          path: ${{ github.workspace }}/artifacts/*.zip
          if-no-files-found: error

