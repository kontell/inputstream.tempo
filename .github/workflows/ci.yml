# Every-PR gate: does it compile for both Kodi versions, and does it package.
# release.yml handles tags and is the only place a release is built.
#
# Renamed from build.yml, and its trigger narrowed. It ran on
# `push: branches: ['**']` *and* `pull_request`, so every push to a feature branch
# with an open PR was billed twice.
name: CI

on:
  push:
    branches: [Omega]
  pull_request:

permissions:
  contents: read

env:
  app_id: inputstream.tempo
  # Pinned Kodi sources. addon.xml.in's @ADDON_DEPENDS@ is filled from these
  # headers, so an unpinned ref lets the declared kodi.binary.instance.inputstream
  # version move with no commit here — and the zip then stops installing on a Kodi
  # the user already has. drift.yml watches upstream tip separately.
  kodi_omega_ref: "21.3-Omega"
  kodi_piers_ref: "22.0b1-Piers"

jobs:
  compile:
    name: compile (${{ matrix.cc }}, ${{ matrix.channel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++, channel: Omega, kodi: 21 }
          - { cc: clang, cxx: clang++, channel: Omega, kodi: 21 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ matrix.channel == 'Omega' && env.kodi_omega_ref || env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        # nasm is for the bundled FFmpeg build, which is what makes this addon's
        # dependency chain heavier than a plain binary addon's.
        run: sudo apt-get update -qq && sudo apt-get install -y autopoint nasm

      - name: Register addon
        shell: bash
        run: |
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${{ github.workspace }}/${app_id}" \
            > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake \
            -B ${app_id}/build \
            -DADDONS_TO_BUILD=${app_id} \
            -DADDON_SRC_PREFIX=${{ github.workspace }} \
            -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/output \
            -DPACKAGE_ZIP=1 \
            ${{ github.workspace }}/xbmc/cmake/addons

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)

  compile-windows:
    name: compile (msvc, ${{ matrix.channel }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: Omega, kodi: 21 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ matrix.channel == 'Omega' && env.kodi_omega_ref || env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          WS="$(pwd -W)"
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${WS}/${app_id}" > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
          cmake \
            -B "${app_id}/build" \
            -G "Visual Studio 17 2022" -A x64 -T host=x64 \
            -DADDONS_TO_BUILD="${app_id}" \
            -DADDON_SRC_PREFIX="${WS}" \
            -DADDONS_DEFINITION_DIR="${WS}/xbmc/cmake/addons/addons" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${WS}/output" \
            -DPACKAGE_ZIP=1 \
            "${WS}/xbmc/cmake/addons"
          cmake --build "${app_id}/build" --config Release --target "${app_id}"

      - name: Did the install tree appear?
        shell: bash
        run: |
          set -uo pipefail
          # The open question behind the missing Windows release assets: the build
          # reports success, but no zip reaches the release. This says plainly
          # whether an installable tree exists after a green build, which is the
          # first thing to know. Informational here; release.yml treats a missing
          # Windows zip as a tracked failure rather than a silent absence.
          echo "--- output/ ---"; ls -la output 2>/dev/null || echo "(no output/)"
          echo "--- output/${app_id} ---"; ls -la "output/${app_id}" 2>/dev/null || echo "(absent)"
          echo "--- any zip anywhere ---"; find . -name '*.zip' -not -path './xbmc/*' 2>/dev/null | head

  package:
    name: package (linux x86_64, ${{ matrix.channel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: Omega, kodi: 21 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ matrix.channel == 'Omega' && env.kodi_omega_ref || env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y autopoint nasm

      - name: Build
        env:
          LDFLAGS: "-static-libstdc++ -static-libgcc"
        run: |
          ${{ github.workspace }}/${app_id}/scripts/build.sh \
            --os linux --arch x86_64 --kodi ${{ matrix.kodi }} \
            --kodi-src ${{ github.workspace }}/xbmc \
            --output ${{ github.workspace }}/artifacts \
            --jobs $(getconf _NPROCESSORS_ONLN)

      - name: Report the ABI floor
        # Reported, not enforced, on PRs — release.yml enforces it. See the note
        # in release.yml about why this addon is not yet built in a pinned
        # container the way pvr.kofin is.
        continue-on-error: true
        run: |
          ${{ github.workspace }}/${app_id}/scripts/check-abi.sh \
            ${{ github.workspace }}/artifacts

      - name: Name zip for this run
        id: name
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(${{ github.workspace }}/artifacts/*.zip)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "expected exactly one zip, got: ${zips[*]:-none}" >&2
            exit 1
          fi
          src="${zips[0]}"
          base="$(basename "$src" .zip)"
          sha7="$(echo "${{ github.sha }}" | cut -c1-7)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            dest="$(dirname "$src")/${base}-pr${{ github.event.pull_request.number }}-${sha7}.zip"
          else
            dest="$(dirname "$src")/${base}-${{ github.ref_name }}-${sha7}.zip"
          fi
          mv "$src" "$dest"
          echo "zip=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-${{ matrix.channel }}-pr-zip
          path: ${{ steps.name.outputs.zip }}
          retention-days: 14
          if-no-files-found: error
